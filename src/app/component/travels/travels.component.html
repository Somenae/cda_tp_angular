@if(travel()) {
    <h1>{{ travel().title }}</h1>
    <p>{{ travel().description }}</p>
    
    @for(step of steps(); track step.id) {
        <div class="step-card">
            <div class="step-title">
                <span (click)="deleteStep(step.id!)" class="delete-button">&#128465;</span>
                <app-steps [step]="step" />
            </div>
        </div>
    }
}
